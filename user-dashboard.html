<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">

            <i class="fa-solid fa-cart-shopping"></i>

            Smart Recommendation

        </div>

        <nav>

            <!-- Dynamic Navbar -->

        </nav>

    </header>

    <!-- ================= DASHBOARD ================= -->

    <section class="dashboard">

        <h1 id="welcomeUser">
            Welcome 👋
        </h1>

        <p>
            Explore products and get personalized recommendations.
        </p>

        <!-- Dashboard Cards -->

        <div class="dashboard-cards">

            <div class="dashboard-card">

                <i class="fa-solid fa-cart-shopping"></i>

                <h2 id="purchaseCount">
                    0
                </h2>

                <p>
                    Purchased Products
                </p>

            </div>

            <div class="dashboard-card">

                <i class="fa-solid fa-star"></i>

                <h2 id="recommendationCount">
                    0
                </h2>

                <p>
                    Recommendations
                </p>

            </div>

            <div class="dashboard-card">

                <i class="fa-solid fa-user"></i>

                <h2 id="currentUserName">
                    User
                </h2>

                <p>
                    Logged In User
                </p>

            </div>

        </div>

        <!-- Quick Actions -->

        <div class="dashboard-buttons">

            <button
                id="browseProductsBtn">

                Browse Products

            </button>

            <button
                id="recommendationBtn">

                View Recommendations

            </button>

             <button id="historyBtn">
        Purchase History
    </button>


        </div>

    </section>

    <!-- Scripts -->

    <script src="product.js"></script>
    <script src="user.js"></script>
    <script src="graph.js"></script>
    <script src="bst.js"></script>
    <script src="minheap.js"></script>
    <script src="LRUcache.js"></script>
    <script src="app.js"></script>

</body>

</html>
