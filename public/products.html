<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!--================ HEADER ================-->

    <header>

        <div class="logo">

            <i class="fa-solid fa-cart-shopping"></i>

            Smart Recommendation

        </div>

        <nav>

            <!-- Dynamic Navbar -->

        </nav>

    </header>

    <!--================ HERO ================-->

    <section class="products-hero">

        <h1>🛍 Featured Products</h1>

        <p>

            Discover the best products specially selected for you.

        </p>

    </section>

    <!--================ SEARCH ================-->

    <section class="search-section">

        <div class="search-bar">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Search by Product ID..."
                 onkeypress="if(event.key==='Enter') searchProduct()">

        </div>

    </section>

    <!--================ MAIN LAYOUT ================-->

    <section  class="products-wrapper">
        <!--========== FILTERS ==========-->

        <aside class="filter-panel">

            <h2>

                <i class="fa-solid fa-sliders"></i>

                Filters

            </h2>

            <div class="filter-group">

                <label>Category</label>

                <select id="categoryFilter">

                    <option value="">All Categories</option>

                    <option value="Electronics">
                        Electronics
                    </option>

                    <option value="Accessories">
                        Accessories
                    </option>

                </select>

            </div>

            <div class="filter-group">

                <label>Minimum Rating</label>

                <select id="ratingFilter">

                    <option value="0">All Ratings</option>

                    <option value="4">4.0+</option>

                    <option value="4.5">4.5+</option>

                    <option value="4.8">4.8+</option>

                </select>

            </div>

            <button onclick="filterProducts()">

                Apply Filters

            </button>

            <button onclick="displayProducts()"
                class="resetBtn">

                Reset

            </button>

        </aside>

        <!--========== PRODUCTS ==========-->

        <div class="products-area">

            <div class="products-top">

                <h2>All Products</h2>

            </div>

            <div
                id="productContainer"
                class="product-grid">

            </div>

        </div>

    </section>

    <!--================ MODAL ================-->

    <div
        id="productModal"
        class="modal">

        <div class="modal-content">

            <h2>

                Add New Product

            </h2>

            <input
                type="number"
                id="productId"
                placeholder="Product ID">

            <input
                type="text"
                id="productName"
                placeholder="Product Name">

            <input
                type="text"
                id="productCategory"
                placeholder="Category">

            <input
                type="number"
                step="0.1"
                id="productRating"
                placeholder="Rating">

            <div class="modal-buttons">

                <button onclick="addNewProduct()">

                    Add Product

                </button>

                <button
                    class="closeBtn"
                    onclick="closeModal()">

                    Cancel

                </button>

            </div>
            
        </div>
    </div>
 <button
                    id="addProductBtn"
                    class="addProductBtn"
                    onclick="openModal()">

                    <i class="fa-solid fa-plus"></i>
                </button>


    <!--================ SCRIPTS ================-->
    
    <script src="product.js"></script>
    <script src="user.js"></script>
    <script src="graph.js"></script>
    <script src="bst.js"></script>
    <script src="minheap.js"></script>
    <script src="LRUcache.js"></script>
    
    <script src="app.js"></script>
</body>

</html>
